<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XRSign — Real-Time Traffic Sign Detection</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
:root{--cols:12;--bl:8px;--lh:24px;--gutter:24px;--margin:72px;--maxw:1296px;--paper:#ffffff;--ink:#111315;--ink-soft:#5b6066;--accent:#0047FF;--accent-soft:rgba(0,71,255,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:var(--lh);-webkit-font-smoothing:antialiased;}
.wrap{position:relative;max-width:var(--maxw);margin:0 auto;padding:48px var(--margin);}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);column-gap:var(--gutter);row-gap:var(--lh);}
.kicker{font-family:'Consolas',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--bl);grid-column:1 / 9;}
.masthead{font-weight:900;font-size:64px;line-height:1.02;letter-spacing:-0.02em;color:var(--ink);grid-column:1 / 13;}
.tagline{grid-column:1 / 9;font-size:18px;line-height:var(--lh);color:var(--ink-soft);margin-top:var(--bl);}
hr.rule{grid-column:1 / 13;border:none;border-top:2px solid var(--ink);margin:24px 0 0;}
.stage{grid-column:1 / 9;position:relative;background:#0b0e14;border:2px solid var(--ink);aspect-ratio:4/3;overflow:hidden;}
.stage video,.stage canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;}
.panel{grid-column:9 / 13;display:flex;flex-direction:column;gap:16px;}
.card{border:2px solid var(--ink);padding:20px;}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:12px;font-family:'Consolas',monospace;}
.btn{display:block;width:100%;padding:14px;margin-bottom:10px;background:var(--accent);color:#fff;border:2px solid var(--accent);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;text-align:center;}
.btn:last-child{margin-bottom:0;}
.btn:hover{background:#0036c9;}
.btn.secondary{background:#fff;color:var(--accent);}
.btn.secondary:hover{background:var(--accent-soft);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
input[type=file]{display:none;}
.status{font-family:'Consolas',monospace;font-size:13px;color:var(--ink-soft);padding-top:8px;border-top:1px solid #ddd;margin-top:8px;}
.status b{color:var(--ink);}
.legend{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-family:'Consolas',monospace;font-size:11px;padding:4px 8px;border:1px solid var(--ink);background:var(--accent-soft);}
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-bottom:12px;font-size:14px;line-height:1.4;}
.chat-msg{padding:8px 10px;border:1px solid var(--ink);}
.chat-msg.user{background:var(--accent-soft);border-color:var(--accent);}
.chat-msg.bot{background:#f6f6f6;}
.chat-role{font-family:'Consolas',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:4px;display:block;}
.chat-input{width:100%;padding:10px;border:2px solid var(--ink);font-family:inherit;font-size:14px;margin-bottom:10px;resize:vertical;min-height:60px;}
.chat-empty{font-family:'Consolas',monospace;font-size:12px;color:var(--ink-soft);}
.foot{grid-column:1 / 13;margin-top:48px;padding-top:16px;border-top:2px solid var(--ink);font-family:'Consolas',monospace;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;}
@media(max-width:900px){.wrap{padding:32px 20px;}.masthead{font-size:36px;}.stage,.panel,.tagline,.kicker{grid-column:1 / 13;}}
</style>
</head>
<body>
<div class="wrap">
<div class="grid">
<div class="kicker">Real-Time Detection // ONNX Runtime Web</div>
<h1 class="masthead">XRSign</h1>
<p class="tagline">Client-side traffic sign detection running entirely in your browser via YOLO + ONNX Runtime Web. No server, no upload.</p>
<hr class="rule">
<div class="stage" id="stage">
<video id="video" autoplay muted playsinline style="display:none"></video>
<canvas id="canvas"></canvas>
</div>
<div class="panel">
<div class="card">
<h3>Input Source</h3>
<button class="btn" id="camBtn" disabled>Start Camera</button>
<button class="btn secondary" id="imgBtn" disabled>Upload Image</button>
<button class="btn secondary" id="vidBtn" disabled>Upload Video</button>
<input type="file" id="imgInput" accept="image/*">
<input type="file" id="vidInput" accept="video/*">
<div class="status">Status: <b id="statusText">Initializing…</b></div>
</div>
<div class="card">
<h3>Ask Agent</h3>
<div class="chat-log" id="chatLog"><div class="chat-empty">Ask anything about traffic signs…</div></div>
<textarea class="chat-input" id="chatInput" placeholder="e.g. What does a yield sign mean?"></textarea>
<button class="btn" id="askBtn">Ask</button>
</div>
<div class="card">
<h3>Classes</h3>
<div class="legend" id="legend"></div>
</div>
</div>
<div class="foot"><span id="dbg">XRSign v1.4</span><span id="fps">0 FPS</span></div>
</div>
</div>
<script>
const CLASSES=["Green Light","Red Light","Speed Limit 10","Speed Limit 100","Speed Limit 110","Speed Limit 120","Speed Limit 20","Speed Limit 30","Speed Limit 40","Speed Limit 50","Speed Limit 60","Speed Limit 70","Speed Limit 80","Speed Limit 90","Stop"];
const NC=CLASSES.length;const INPUT_SIZE=640;const CONF=0.4;
const AGENT_URL="https://xrsign-gemini.mirindiderick.workers.dev/";
let session=null,mode=null,running=false,lastTime=performance.now(),shown=false;
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusText=document.getElementById('statusText');
const camBtn=document.getElementById('camBtn');
const imgBtn=document.getElementById('imgBtn');
const vidBtn=document.getElementById('vidBtn');
const imgInput=document.getElementById('imgInput');
const vidInput=document.getElementById('vidInput');
const fpsEl=document.getElementById('fps');
const dbg=document.getElementById('dbg');
const legend=document.getElementById('legend');
CLASSES.forEach(function(c){const chip=document.createElement('div');chip.className='chip';chip.textContent=c;legend.appendChild(chip);});
function setStatus(t){statusText.textContent=t;}
async function loadModel(){try{setStatus('Loading model (best.onnx)…');camBtn.disabled=true;imgBtn.disabled=true;vidBtn.disabled=true;session=await ort.InferenceSession.create('./best.onnx',{executionProviders:['wasm']});camBtn.disabled=false;imgBtn.disabled=false;vidBtn.disabled=false;setStatus('Model loaded — select an input');}catch(e){setStatus('Model load failed: '+e.message);}}
function letterbox(img,size){const c=document.createElement('canvas');c.width=size;c.height=size;const cc=c.getContext('2d');cc.fillStyle='#727272';cc.fillRect(0,0,size,size);const iw=img.videoWidth||img.width;const ih=img.videoHeight||img.height;const scale=Math.min(size/iw,size/ih);const nw=iw*scale,nh=ih*scale;const dx=(size-nw)/2,dy=(size-nh)/2;cc.drawImage(img,dx,dy,nw,nh);return{canvas:c,scale:scale,dx:dx,dy:dy,iw:iw,ih:ih};}
function preprocess(c){const cc=c.getContext('2d');const d=cc.getImageData(0,0,c.width,c.height).data;const s=c.width;const f=new Float32Array(3*s*s);for(let i=0;i<s*s;i++){f[i]=d[i*4]/255;f[s*s+i]=d[i*4+1]/255;f[2*s*s+i]=d[i*4+2]/255;}return new ort.Tensor('float32',f,[1,3,s,s]);}
async function runInference(srcEl){const lb=letterbox(srcEl,INPUT_SIZE);const tensor=preprocess(lb.canvas);const feeds={};feeds[session.inputNames[0]]=tensor;const results=await session.run(feeds);const out=results[session.outputNames[0]];const data=out.data;const dims=out.dims;if(!shown){shown=true;dbg.textContent='out '+session.outputNames[0]+' dims['+dims.join(',')+']';}
const n=dims[1],step=dims[2];const dets=[];for(let i=0;i<n;i++){const o=i*step;const conf=data[o+4];if(conf>CONF){const cls=Math.round(data[o+5]);let x1=data[o],y1=data[o+1],x2=data[o+2],y2=data[o+3];x1=(x1-lb.dx)/lb.scale;y1=(y1-lb.dy)/lb.scale;x2=(x2-lb.dx)/lb.scale;y2=(y2-lb.dy)/lb.scale;dets.push({x1:x1,y1:y1,x2:x2,y2:y2,conf:conf,cls:cls});}}
const sx=canvas.width/lb.iw,sy=canvas.height/lb.ih;ctx.drawImage(srcEl,0,0,canvas.width,canvas.height);ctx.lineWidth=3;ctx.font='16px Consolas, monospace';dets.forEach(function(d){const x1=d.x1*sx,y1=d.y1*sy,x2=d.x2*sx,y2=d.y2*sy;const name=(d.cls>=0&&d.cls<NC)?CLASSES[d.cls]:('id'+d.cls);const label=name+' '+(d.conf*100).toFixed(1)+'%';ctx.strokeStyle='#0047FF';ctx.strokeRect(x1,y1,x2-x1,y2-y1);const tw=ctx.measureText(label).width;ctx.fillStyle='#0047FF';ctx.fillRect(x1,y1-22,tw+10,22);ctx.fillStyle='#fff';ctx.fillText(label,x1+5,y1-6);});return dets.length;}
function sizeCanvas(el){canvas.width=el.videoWidth||el.width;canvas.height=el.videoHeight||el.height;}
imgBtn.addEventListener('click',function(){if(session)imgInput.click();});
vidBtn.addEventListener('click',function(){if(session)vidInput.click();});
imgInput.addEventListener('change',function(e){const file=e.target.files[0];if(!file||!session)return;stopAll();const img=new Image();img.onload=async function(){sizeCanvas(img);setStatus('Running inference…');const k=await runInference(img);setStatus('Done — '+k+' detections');};img.src=URL.createObjectURL(file);});
vidInput.addEventListener('change',function(e){const file=e.target.files[0];if(!file||!session)return;stopAll();mode='video';video.srcObject=null;video.src=URL.createObjectURL(file);video.loop=true;video.muted=true;video.style.display='block';video.onloadeddata=async function(){sizeCanvas(video);await video.play();running=true;setStatus('Running video…');loop();};});
camBtn.addEventListener('click',async function(){if(!session)return;if(running&&mode==='camera'){stopAll();camBtn.textContent='Start Camera';setStatus('Model loaded — select an input');return;}stopAll();try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});mode='camera';video.srcObject=stream;video.src='';video.style.display='block';await video.play();sizeCanvas(video);running=true;camBtn.textContent='Stop Camera';setStatus('Running…');loop();}catch(e){setStatus('Camera error: '+e.message);}});
function stopAll(){running=false;if(video.srcObject){video.srcObject.getTracks().forEach(function(t){t.stop();});video.srcObject=null;}video.pause();video.removeAttribute('src');video.style.display='none';camBtn.textContent='Start Camera';}
async function loop(){if(!running)return;sizeCanvas(video);await runInference(video);const now=performance.now();fpsEl.textContent=(1000/(now-lastTime)).toFixed(1)+' FPS';lastTime=now;requestAnimationFrame(loop);}
const chatLog=document.getElementById('chatLog');
const chatInput=document.getElementById('chatInput');
const askBtn=document.getElementById('askBtn');
let emptyCleared=false;
function addMsg(role,text){if(!emptyCleared){chatLog.innerHTML='';emptyCleared=true;}const wrap=document.createElement('div');wrap.className='chat-msg '+(role==='user'?'user':'bot');const r=document.createElement('span');r.className='chat-role';r.textContent=(role==='user'?'You':'Agent');const b=document.createElement('div');b.textContent=text;wrap.appendChild(r);wrap.appendChild(b);chatLog.appendChild(wrap);chatLog.scrollTop=chatLog.scrollHeight;return b;}
async function askAgent(){const q=chatInput.value.trim();if(!q)return;addMsg('user',q);chatInput.value='';askBtn.disabled=true;const pending=addMsg('bot','Thinking…');try{const resp=await fetch(AGENT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q})});const data=await resp.json();if(!resp.ok){pending.textContent='Error: '+(data.error||resp.status);}else{pending.textContent=data.text||'No response.';}}catch(err){pending.textContent='Network error: '+err.message;}finally{askBtn.disabled=false;chatLog.scrollTop=chatLog.scrollHeight;}}
askBtn.addEventListener('click',askAgent);
chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askAgent();}});
loadModel();
</script>
</body>
</html>
